services:
  - type: web
    name: tayyar-gateway
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: node server.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOST
        value: 0.0.0.0
      - key: BACKEND_HOST
        fromService:
          name: tayyar-api
          type: web
          property: host
      - key: BACKEND_PORT
        value: "10000"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.1-flash-live-preview
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM
      - key: ELEVENLABS_VOICE_MALE_ID
        value: pNInz6obpgDQGcFmaJgB
      - key: ELEVENLABS_VOICE_FEMALE_ID
        value: 21m00Tcm4TlvDq8ikWAM

  - type: web
    name: tayyar-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn server:app --host 0.0.0.0 --port 10000
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "10000"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        value: "*"
